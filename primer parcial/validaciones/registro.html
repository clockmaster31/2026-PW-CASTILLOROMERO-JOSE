<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
  <header>
    <a href="./detalle.html">Volver al taller</a>
  </header>
  <main>
    <form action="" class="formualrio-registro" id="form-registro" novalidate>
      <h1>Registrar Asistencia</h1>
      <label for="nombre">Nombre: </label>
      <span class="error" id="error-nombre"></span>
      <input type="text" name="nombre" id="nombre" required>
      <label for="boleta">Número de Boleta: </label>
      <input type="text" id="boleta" name="boleta" required>
      <span class="error" id="error-boleta"></span>
      <label for="">Fecha de Registro (DD/MM/AAAA)</label>
      <input type="text" id="fecha" name="fecha" placeholder="DD/MM/AAAA" required>
      <span class="error" id="error-fecha"></span>
      <button type="submit">Registrar</button>
      <p class="mensaje-exito" id="mensaje-exito"></p>
    </form>
  </main>
  <script src="./js/validaciones.js">

  </script>
</body>
</html>
