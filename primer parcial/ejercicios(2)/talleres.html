<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejecicios</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Ejercicios</h1>
    </header>
    <main>
        <section class="ejercicio" >
            <h2 id="titulo-arreglos"> Arreglos del codigo <code>01-arreglos.js</code> </h2>
            <p>Datos de prueba con JS</p>
            <div class="tabla-scroll" >
                <table id="tabla-talleres">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>

            <form id="form-arreglos" class="formulario" >
                <div class="campos" >
                    <label for="operacion-arreglo" name="operacion-arreglo">Operación</label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="forEach">ForEach - Lista Simple</option>
                        <option value="map">map - Copia solo Nombres</option>
                        <option value="filter">filter - Filtrar Talleres con cupo lleno</option>
                        <option value="find">find - Buscar por el nombre del instructor</option>
                    </select>
                </div>

                <button type="submit" >Ejecutar</button>

            </form>

            <output class="resultado" id="resultado-arreglo" for="form-arreglo" ></output>
        </section>

        <section class="ejercicio" aria-labelledby="titulo-objetos">
            <h2 id="titulo-objeto">Manejo de objetos y Jsons</h2>
            <p>Elige que operacion deseas aplicar</p>
            <form id= "formulario-objeto" class="formulario">

                <div class="campos">
                    <label for="obj-nombre">Nombre</label>
                    <input type="text" name="obj-nombre" id="obj-nombre" value="Introduccion a Phyton">
                </div>
                 <div class="campos">
                    <label for="obj-instructor">Instructor</label>
                    <input type="text" name="obj-instructor" id="obj-instructor" value="Ing. María López">
                </div>
                 <div class="campos">
                    <label for="obj-cupo">Cupo</label>
                    <input type="number" name="obj-cupo" id="obj-cupo" value="25" min="0">
                </div>
                <div class="campos">
                    <label for="obj-inscritos">Inscritos</label>
                    <input type="number" name="obj-inscritos" id="obj-inscritos" value="25" min="0">
                </div>
                <div class="campos" >
                    <label for="operacion-objeto">Tipo de operacion</label>
                    <select name="operacion-objeto" id="operacion-objeto1">
                        <option value="keys">Object.keys</option>
                        <option value="values">Object.values</option>
                        <option value="entries">Object.entries</option>
                        <option value="stringify">Json a cadena</option>
                        <option value="roundTrip"> Ida y vuelta (json a cadena)</option>
                    </select>
                </div>

                <button type="submit">Ejecutar opcion</button>
            </form>
            <output class="resultado" id="resultado-objeto" for="formulario-objeto"></output>
        </section>

        <section>

            <section class="ejercicio" aria-labelledby="titulo-texto">

                <h2 id="titulo-texto">3-Strings y fechas</h2>

                <p>La fecha usa el mismo formato</p>

                <strong>DD/MM/AAAA</strong>

                <form id="form-texto" class="formulario">
                    <div class="campos">
                        <label for="nombre-texto">
                            Nombre (con espacios a proposito)
                        </label>
                        <input type="text" id="nombre-texto" name="nombre-texto" value="    Maria Lopez   ">
                    </div>
                      <div class="campos">
                        <label for="cupo-texto">
                           Cupo, para el template
                        </label>
                        <input type="number" id="cupo-texto" name="cupo-texto" value="25" min="0" >
                    </div>
                      <div class="campos">
                        <label for="fecha-texto">
                           Fecha de asistencia (DD/MM/AAAA)
                        </label>
                        <input type="text" id="fecha-texto" name="fecha-texto" value="05/09/2026" placeholder="05/09/2026">
                        <span class="error" id="error-fecha"></span>
                    </div>
                    <button type="submit">Ejecutar</button>
                
                </form>
                <output class="resultado" id="resultado-texto" for="form-texto"></output>
            </section>
        </section>
    </main>

    <script src="./js/app.js" ></script>
    
</body>
</html>
